<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physicians & Specialists Directory - CU MedConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <div class="header-container">
      <a href="/index.html" class="logo-area">
        <div class="logo-icon">🩺</div>
        <div class="logo-text">
          <h1>CU MedConnect</h1>
          <p>Healthcare Platform</p>
        </div>
      </a>
      <div class="header-actions">
        <nav class="nav-links" id="global-nav-links"></nav>
        <button class="sos-btn" onclick="openSosModal()">
          🚨 Emergency SOS
        </button>
        <div id="auth-actions"></div>
      </div>
    </div>
  </header>

  <!-- Main Doctors Content -->
  <main>
    <div class="section-header" style="flex-wrap: wrap; gap: 1rem;">
      <div>
        <h2>Doctors</h2>
        <p>Browse the sample doctor listings.</p>
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button class="btn btn-outline" onclick="filterSpecialization('')">All Specialties</button>
        <button class="btn btn-outline" onclick="filterSpecialization('Medicine')">General Medicine</button>
        <button class="btn btn-outline" onclick="filterSpecialization('Cardio')">Cardiology</button>
        <button class="btn btn-outline" onclick="filterSpecialization('Ortho')">Orthopedics</button>
      </div>
    </div>

    <div class="grid" id="doctors-grid">
      <div class="card">Loading physicians...</div>
    </div>
  </main>

  <!-- Emergency SOS Modal -->
  <div id="sos-modal" class="modal-overlay">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <h3 style="color:var(--danger); font-size:1.3rem; font-weight:800; display:flex; align-items:center; gap:0.5rem;">
          🚨 Emergency Request
        </h3>
        <button onclick="closeSosModal()" style="border:none; background:none; font-size:1.6rem; cursor:pointer; color:#64748b;">&times;</button>
      </div>
      <p style="color:#64748b; font-size:0.875rem; margin-bottom:1.25rem;">
        This prototype records the request only and does not contact responders. Call 112 for immediate help.
      </p>
      <form onsubmit="handleSendSos(event)">
        <div class="form-group">
          <label>Patient ID</label>
          <input type="number" id="sos-patientId" class="form-control" value="1" required>
        </div>
        <div class="form-group">
          <label>Coordinates (Latitude, Longitude)</label>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem;">
            <input type="number" step="0.000001" id="sos-lat" class="form-control" value="30.768800" required>
            <input type="number" step="0.000001" id="sos-lng" class="form-control" value="76.575400" required>
          </div>
        </div>
        <div class="form-group">
          <label>What happened and where?</label>
          <textarea id="sos-desc" class="form-control" rows="2" placeholder="Describe emergency and campus block location..." required></textarea>
        </div>
        <button type="submit" class="sos-btn" style="width:100%; justify-content:center; padding:0.85rem; font-size:0.95rem;">
          RECORD SOS REQUEST
        </button>
      </form>
      <div id="sos-result" style="margin-top:1rem; display:none;"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/js/app.js"></script>
  <script>
    async function loadDoctors(spec = '') {
      renderHeaderNav('doctors');
      const container = document.getElementById('doctors-grid');
      const session = getSession();

      try {
        const url = spec ? '/api/doctors?specialization=' + encodeURIComponent(spec) : '/api/doctors';
        const res = await fetch(url);
        if (res.ok) {
          const list = await res.json();
          if (list.length === 0) {
            container.innerHTML = '<div class="card">No physicians found for selected specialization.</div>';
            return;
          }
          container.innerHTML = list.map(d => `
            <div class="card">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.75rem;">
                <h3 class="card-title">${escapeHtml(d.fullName)}</h3>
                <span class="badge badge-specialty">${escapeHtml(d.specialization)}</span>
              </div>
              <div class="card-meta">🏥 ${escapeHtml(d.hospitalName)}</div>
              <div style="margin-top:1rem; padding-top:0.75rem; border-top:1px solid var(--slate-100); display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:0.8rem; color:#15803d; font-weight:700;">Listed doctor</span>
                <a href="${session && session.role === 'patient' ? '/patient-dashboard.html' : '/index.html'}" 
                   class="btn btn-primary" style="padding:0.45rem 0.9rem; font-size:0.8rem;">
                   Book Consultation
                </a>
              </div>
            </div>
          `).join('');
        }
      } catch(e) {
        container.innerHTML = '<div class="card">Error loading doctors.</div>';
      }
    }

    function filterSpecialization(spec) {
      loadDoctors(spec);
    }

    loadDoctors();
  </script>
</body>
</html>
