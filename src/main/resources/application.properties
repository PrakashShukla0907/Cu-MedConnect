# HTTP server
server.port=${PORT:8081}

# MySQL connection. createDatabaseIfNotExist creates the database if it is missing.
spring.datasource.url=jdbc:mysql://localhost:3306/CuMed?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:pratik123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Run schema.sql on startup. The SQL uses IF NOT EXISTS / INSERT IGNORE for repeatability.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8




